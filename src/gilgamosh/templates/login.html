{% extends 'base.html' %}{% block content %}
<div class="panel panel-body mx-auto mt-16 max-w-md">
  <img class="app-logo mx-auto mb-5 w-56" src="{{ url_for('static', filename='logo.png') }}" alt="">
  <p class="eyebrow mb-2">RoundTable · Institutionelle Verhandlungssimulation</p>
  <h1 class="mb-6 text-2xl font-semibold text-slate-900">Anmelden</h1>
  {% if error %}<p class="notice notice-bad mb-4" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span class="field-label">Benutzername</span><input class="input input-bordered" name="username" autocomplete="username" required></label>
    <label class="field"><span class="field-label">Passwort</span><input class="input input-bordered" type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary w-full" type="submit">Anmelden</button>
  </form>
</div>
{% endblock %}
