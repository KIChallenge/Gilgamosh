{% extends 'base.html' %}{% block content %}
<div class="max-w-md mx-auto mt-16 card bg-white p-8"><p class="text-teal-700 text-sm mb-2">Institutionelle Verhandlungssimulation</p><h1 class="text-2xl font-semibold mb-6">Anmelden</h1>
{% if error %}<p class="alert alert-error mb-4" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-control">Benutzername<input class="input input-bordered" name="username" autocomplete="username" required></label>
<label class="form-control">Passwort<input class="input input-bordered" type="password" name="password" autocomplete="current-password" required></label>
<button class="btn bg-teal-800 text-white w-full" type="submit">Anmelden</button></form></div>
{% endblock %}
