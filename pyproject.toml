[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gilgamosh"
version = "0.1.0"
description = "Institutionelle Verhandlungssimulation"
readme = "README.md"
requires-python = ">=3.11.7"
dependencies = [
  "flask>=3.1,<4", "flask-sqlalchemy>=3.1,<4", "flask-login>=0.6,<1",
  "flask-wtf>=1.2,<2", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pydantic>=2.10,<3",
  "cryptography>=44", "gunicorn>=23,<24"
]

[project.scripts]
gilgamosh = "gilgamosh.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.hatch.build.targets.wheel]
packages = ["src/gilgamosh"]

[tool.hatch.build.targets.wheel.force-include]
"src/prompts/agents" = "gilgamosh/stakeholders"
